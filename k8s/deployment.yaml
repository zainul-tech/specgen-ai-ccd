apiVersion: apps/v1
kind: Deployment
metadata:
  name: specgen-ai
  labels:
    app: specgen-ai
    tier: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: specgen-ai
  template:
    metadata:
      labels:
        app: specgen-ai
        tier: web
    spec:
      containers:
      - name: specgen-ai
        # Replace YOUR_DOCKERHUB_USERNAME with your actual Docker Hub username
        image: zainu/specgen-ai:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: SECRET_KEY
          value: "cca2-production-secret-specgen-ai-auth"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
